name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sanity:
    name: Repo sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: tools/ta.py is syntactically valid
        run: python -m py_compile tools/ta.py

      - name: ta.py --help works
        run: python tools/ta.py --help

      - name: install.ps1 parameters do not collide with PowerShell's own
        shell: pwsh
        run: |
          # A parameter named -Db is rejected outright at binding time, because
          # 'db' is the built-in alias for -Debug that [CmdletBinding()] adds.
          # The script then fails for everyone before it runs a single line, and
          # a parse check does NOT catch it - this was shipped once already.
          $reserved = @{}
          foreach ($p in [System.Management.Automation.Internal.CommonParameters].GetProperties()) {
            $reserved[$p.Name] = $p.Name
            foreach ($a in $p.GetCustomAttributes([System.Management.Automation.AliasAttribute], $false)) {
              foreach ($n in $a.AliasNames) { $reserved[$n] = $p.Name }
            }
          }

          $text = Get-Content install.ps1 -Raw
          $errors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { $_.Message }; exit 1 }

          $names = $ast.ParamBlock.Parameters | ForEach-Object { $_.Name.VariablePath.UserPath }
          $bad = @()
          foreach ($n in $names) {
            $hit = $reserved.Keys | Where-Object { $_ -eq $n }
            if ($hit) { $bad += "  -$n conflicts with the common parameter -$($reserved[$hit])" }
          }
          if ($bad) {
            Write-Host "install.ps1 declares parameters PowerShell reserves:"
            $bad | ForEach-Object { Write-Host $_ }
            Write-Host "Rename them - the script cannot run at all otherwise."
            exit 1
          }
          Write-Host "install.ps1: $($names.Count) parameters, none reserved by PowerShell"

      - name: SETUP.md documents every installer flag
        run: |
          python - <<'PY'
          # Three sessions edit tools/ta.py. A flag added without a docs row is
          # invisible to anyone who did not write it, and the PowerShell name
          # cannot be guessed from the bash one - so check both directions.
          #
          # This looks for a TABLE ROW, not merely the string somewhere in the
          # file: a flag used in an example further down would otherwise satisfy
          # a substring check while having no reference entry at all.
          import re, sys, pathlib

          src = pathlib.Path("tools/ta.py").read_text()
          block = src[src.index('sub.add_parser("install"'):src.index("p.set_defaults(func=cmd_install)")]
          flags = set()
          for m in re.finditer(r'p\.add_argument\((.*?)\)\n', block, re.S):
              flags |= {n for n in re.findall(r'"(--[a-zA-Z][\w-]*)"', m.group(1))}

          # Only the SCRIPT's param block, not parameters of functions defined
          # inside it - those are internal and have no business in user docs.
          ps = pathlib.Path("install.ps1").read_text()
          start = ps.index("param(")
          depth, end = 0, None
          for i, ch in enumerate(ps[start:], start):
              if ch == "(":
                  depth += 1
              elif ch == ")":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break
          params = set(re.findall(r'^\s*\[[\w\[\]]+\]\s*\$(\w+)', ps[start:end], re.M))

          # Only markdown table rows count as documentation.
          rows = [l for l in pathlib.Path("SETUP.md").read_text().splitlines()
                  if l.lstrip().startswith("|")]
          table = "\n".join(rows)

          missing_flags = sorted(f for f in flags if f not in table)
          missing_params = sorted(f"-{p}" for p in params if f"-{p}" not in table)

          if missing_flags or missing_params:
              if missing_flags:
                  print("Installer flags with no table row in SETUP.md:", ", ".join(missing_flags))
              if missing_params:
                  print("install.ps1 parameters with no table row:", ", ".join(missing_params))
              print("Add them to the flag table in SETUP.md section 1.")
              sys.exit(1)
          print(f"SETUP.md documents all {len(flags)} flags and {len(params)} PowerShell parameters")
          PY

      - name: Every validation test proves it can fail
        run: python tools/tests/test_tests_can_fail.py

      - name: Migrations match the body types
        run: python tools/tests/test_migrations_match_chassis.py

      - name: Character creation is limited to the three body types
        run: python tools/tests/test_body_types.py

      - name: Module format strings use fmt, not printf
        run: python tools/tests/test_format_strings.py

      - name: CharBaseInfo.dbc reader
        run: python tools/tests/test_charbaseinfo.py

      - name: Installer choice logic
        run: |
          # The installer's answers become the realm's configuration, so a bug
          # here is a broken install rather than a cosmetic problem. Two caught
          # this way: a --db flag storing the menu label instead of the key, and
          # --db-password storing the asterisks shown on screen.
          rm -f tools/local.json
          python tools/tests/test_install_choices.py
          rm -f tools/local.json

      - name: upstream.json is valid and complete
        run: |
          python - <<'PY'
          import json, re, sys
          cfg = json.load(open("upstream.json"))
          base = cfg["base"]
          for key in ("name", "url", "branch", "pinned_commit", "pinned_date"):
              assert base.get(key), f"upstream.json: base.{key} is missing"
          assert re.fullmatch(r"[0-9a-f]{40}", base["pinned_commit"]), \
              "pinned_commit must be a full 40-char SHA, not a branch or short SHA"
          assert cfg.get("modules"), "upstream.json: no modules listed"
          print(f"pinned: {base['name']} @ {base['pinned_commit'][:12]} ({base['pinned_date']})")
          PY

      - name: Pinned upstream commit actually exists
        run: |
          SHA=$(python -c "import json;print(json.load(open('upstream.json'))['base']['pinned_commit'])")
          URL=$(python -c "import json;print(json.load(open('upstream.json'))['base']['url'])")
          git init -q probe && cd probe
          git remote add origin "$URL"
          git fetch --depth 1 origin "$SHA" && echo "upstream pin $SHA is fetchable"

      - name: Every declared module exists and has a matching loader
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          cfg = json.load(open("upstream.json"))
          bad = []
          for name in cfg["modules"]:
              d = pathlib.Path("modules") / name
              if not d.is_dir():
                  bad.append(f"{name}: directory missing"); continue
              # AzerothCore derives the loader name from the directory name.
              expected = "Add" + name.replace("-", "_") + "Scripts"
              srcs = list((d / "src").rglob("*.cpp"))
              if not any(expected in s.read_text(errors="replace") for s in srcs):
                  bad.append(f"{name}: no source defines {expected}()")
              if not list((d / "conf").glob("*.conf.dist")):
                  bad.append(f"{name}: no .conf.dist")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("modules OK")
          PY

      - name: No core checkout or client data committed
        run: |
          # The overlay model depends on .acore/ never entering git history,
          # and Blizzard client data must never be redistributed.
          FOUND=$(git ls-files | grep -E '^\.acore/|\.mpq$|^data/client/|\.(dbc|map|vmtree|vmtile|mmtile)$' || true)
          if [ -n "$FOUND" ]; then
            echo "These must never be committed:"; echo "$FOUND"; exit 1
          fi
          echo "clean"

      - name: The licence is present and consistent
        run: |
          # ADR 0007. This repository spent its whole life so far asserting that
          # AzerothCore is AGPL-3.0; it is GPL-2.0-or-later, and the wrong claim
          # had reached the public FAQ. AGPL-3.0 is incompatible with
          # GPL-2.0-only, so this is a real hazard rather than a typo.
          test -f LICENSE || { echo "LICENSE is missing"; exit 1; }
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE || { echo "LICENSE is not the GPL"; exit 1; }
          grep -q "Version 2, June 1991" LICENSE || { echo "LICENSE is not GPL-2"; exit 1; }

          STALE=$(grep -rn 'AGPL\|Affero' \
                    --include='*.md' --include='*.toml' --include='*.json' \
                    --include='*.ts' --include='*.tsx' --include='*.py' \
                    --include='*.cpp' --include='*.h' \
                    --exclude-dir=node_modules --exclude-dir=target \
                    --exclude-dir=.next --exclude-dir=.acore \
                    . | grep -v 'not AGPL-3.0' | grep -v '0007-licence.md' || true)
          if [ -n "$STALE" ]; then
            echo "Something still claims this project is AGPL. It is GPL-2.0-or-later:"
            echo "$STALE"
            echo "See docs/decisions/0007-licence.md."
            exit 1
          fi

          # Our own C++ links into a GPL binary alongside the core's, so a file
          # without a notice is genuinely ambiguous about its terms.
          BARE=$(grep -rLi 'GNU General Public License' modules --include='*.cpp' --include='*.h' || true)
          if [ -n "$BARE" ]; then
            echo "These module sources carry no licence header:"; echo "$BARE"; exit 1
          fi

          # Every manifest a package manager reads should agree with LICENSE.
          python3 - <<'PY'
          import json, pathlib, sys, re
          bad = []
          for path in ["web/package.json", "web-admin/package.json", "launcher/ui/package.json"]:
              got = json.loads(pathlib.Path(path).read_text()).get("license")
              if got != "GPL-2.0-or-later":
                  bad.append(f"{path}: license is {got!r}")
          for path in ["launcher/core/Cargo.toml", "launcher/src-tauri/Cargo.toml"]:
              text = pathlib.Path(path).read_text()
              if not re.search(r'^license\s*=\s*"GPL-2\.0-or-later"', text, re.M):
                  bad.append(f"{path}: license is not GPL-2.0-or-later")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("manifests agree with LICENSE")
          PY
          echo "clean"

      - name: The launcher names no way to obtain a client
        run: |
          # ADR 0005 rules 1 and 4, enforced rather than remembered. The manifest
          # types already make a download location for a Blizzard file
          # unrepresentable; this catches an attempt to put one anywhere else,
          # and it catches a large file being committed under launcher/ at all.
          if [ ! -d launcher ]; then echo "no launcher/ yet"; exit 0; fi

          # shipped_manifest.rs is excluded because it is this same guard,
          # written in Rust against the manifest files - it has to name the
          # strings it forbids, and greping the guard for what it guards
          # against is the one false positive this check can produce.
          BAD=$(grep -rEni 'magnet:\?xt=|\.torrent\b|thepiratebay|1337x|rarbg|nyaa\.si' \
                  --exclude-dir=target --exclude-dir=node_modules --exclude-dir=dist \
                  --exclude=shipped_manifest.rs \
                  launcher/ || true)
          if [ -n "$BAD" ]; then
            echo "A locator for a client appears under launcher/:"
            echo "$BAD"
            echo "See docs/decisions/0005-client-distribution.md, rules 1 and 6."
            exit 1
          fi

          # Nothing under launcher/ should be big. Our own patch content is
          # served, never committed, and a stray archive is how a repository
          # quietly becomes a mirror.
          # `if` rather than `[ ... ] && echo`: the && form makes the loop's exit
          # status 1 whenever the LAST file is under the limit, which under
          # `bash -e` aborts the step before it can report anything. The guard
          # then fails on a clean tree and passes nothing - it was failing this
          # way on every commit that had a launcher/ directory.
          LARGE=$(git ls-files -s launcher | awk '{print $4}' | while read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt 1048576 ]; then echo "$f ($size bytes)"; fi
          done)
          if [ -n "$LARGE" ]; then
            echo "Files over 1 MB are committed under launcher/:"; echo "$LARGE"; exit 1
          fi
          echo "clean"

      - name: A changed recipe raises its version
        run: |
          # ADR 0009 §3. The recipe describes edits to a player's game
          # directory, and the version is the only thing the launcher compares
          # when deciding whether to rebuild. A recipe that changes without its
          # version changing is a change that silently never reaches anyone —
          # or worse, reaches half of them.
          if [ ! -d launcher/recipes ]; then echo "no recipes yet"; exit 0; fi
          git fetch --depth=1 origin main >/dev/null 2>&1 || {
            echo "::warning::no origin/main to compare against; skipping"; exit 0; }

          fail=0
          for file in launcher/recipes/*.json; do
            [ -f "$file" ] || continue
            before=$(git show "origin/main:$file" 2>/dev/null || true)
            if [ -z "$before" ]; then
              echo "  $file is new"
              continue
            fi
            if [ "$before" = "$(cat "$file")" ]; then
              echo "  $file is unchanged"
              continue
            fi
            new=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$file")
            old=$(printf '%s' "$before" | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
            if [ "$new" -le "$old" ]; then
              echo "  $file changed but its version is still $new (main has $old)"
              fail=1
            else
              echo "  $file: $old -> $new"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo
            echo "Raise the recipe's version in the same commit that changes it."
            echo "See docs/decisions/0009-recipe-versioning.md §3."
            exit 1
          fi
          echo "clean"

      - name: No core modifications have crept in
        run: |
          # ADR 0002: the classless system needs zero AzerothCore C++ patches.
          # If that ever stops being true, this fails loudly and the decision
          # gets revisited on purpose rather than by drift.
          if [ -d patches ] && [ -n "$(ls -A patches 2>/dev/null)" ]; then
            echo "::warning::patches/ is non-empty - we now carry core modifications."
            echo "Update docs/decisions/0002-repo-layout.md and ARCHITECTURE.md §2."
          fi
          echo "checked"

      - name: Module SQL uses directories the DB updater recognises
        run: |
          python - <<'PY'
          import json, pathlib, sys
          # UpdateFetcher.cpp matches module SQL dirs by substring against
          # "world" / "auth" / "characters". Anything else is silently ignored,
          # which is a nasty way to lose a migration.
          valid = ("db-world", "db-auth", "db-characters")
          bad = []
          for name in json.load(open("upstream.json"))["modules"]:
              sqlroot = pathlib.Path("modules") / name / "data" / "sql"
              if not sqlroot.is_dir():
                  continue
              for child in sqlroot.iterdir():
                  if child.is_dir() and child.name not in valid:
                      bad.append(f"{child}: not one of {valid}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("module SQL layout OK")
          PY

      - name: Staged SQL cannot be applied by accident
        run: |
          python - <<'PY'
          import json, pathlib, sys
          # sql-staged/ holds generated migrations that are written but must not
          # run until somebody decides they should. The updater only reads
          # data/sql/db-*, so the guard is simply that nothing staged has also
          # been left in the applied tree under the same name - which is what a
          # half-finished "promote it" looks like.
          bad = []
          for name in json.load(open("upstream.json"))["modules"]:
              staged = pathlib.Path("modules") / name / "data" / "sql-staged"
              applied = pathlib.Path("modules") / name / "data" / "sql"
              if not staged.is_dir():
                  continue
              if staged.resolve().is_relative_to(applied.resolve()):
                  bad.append(f"{staged}: inside data/sql, the updater would run it")
              names = {f.name for f in staged.glob("*.sql")}
              for f in applied.rglob("*.sql"):
                  if f.name in names:
                      bad.append(f"{f}: same filename as a staged migration")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("staged SQL is staged")
          PY

      - name: The item audit tool is runnable
        run: |
          python -c "import ast; ast.parse(open('tools/audit_items.py').read())"
          python tools/audit_items.py --help > /dev/null
          echo "audit_items.py OK"

      - name: The generators are runnable
        run: |
          python -c "import ast; ast.parse(open('tools/gen_body_types.py').read())"
          python tools/gen_body_types.py --help > /dev/null
          echo "gen_body_types.py OK"

      - name: Documentation links resolve
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # Skipped: the fetched core, installed dependencies, build output, and
          # web/content/, whose links are website routes rather than file paths.
          SKIP = {".acore", "node_modules", ".next", "content"}
          bad = []
          for md in pathlib.Path(".").rglob("*.md"):
              if SKIP & set(md.parts):
                  continue
              for link in re.findall(r"\]\(([^)#][^)]*)\)", md.read_text(errors="replace")):
                  if link.startswith(("http://", "https://", "mailto:", "/")):
                      continue
                  target = (md.parent / link.split("#")[0]).resolve()
                  if not target.exists():
                      bad.append(f"{md}: broken link -> {link}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all relative doc links resolve")
          PY

  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/core

      # The core carries every behaviour worth testing and has no GUI
      # dependency, so all of this runs on a plain runner with no webview.
      - name: Format
        run: cargo fmt --manifest-path launcher/core/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path launcher/core/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path launcher/core/Cargo.toml

      - name: The core builds without its network feature
        run: cargo check --manifest-path launcher/core/Cargo.toml --no-default-features

      - name: The manifest generator runs
        run: |
          cargo build --manifest-path launcher/core/Cargo.toml --bin ashmorrow-manifest
          # A synthetic client: enough structure and a real version resource, so
          # this exercises detection, walking and hashing without a game.
          python3 - <<'PY'
          import pathlib, struct
          root = pathlib.Path("/tmp/fake-client")
          (root / "Data" / "enUS").mkdir(parents=True, exist_ok=True)
          exe = bytearray(b"MZ" + b"\x11" * 30)
          exe += bytes([0xBD, 0x04, 0xEF, 0xFE])
          exe += struct.pack("<I", 0x00010000)
          exe += struct.pack("<I", (3 << 16) | 3)
          exe += struct.pack("<I", (5 << 16) | 12340)
          (root / "Wow.exe").write_bytes(bytes(exe))
          (root / "Data" / "common.MPQ").write_bytes(b"x" * 4096)
          PY
          ./launcher/core/target/debug/ashmorrow-manifest hash /tmp/fake-client | tee /tmp/out.json
          python3 -c "import json;d=json.load(open('/tmp/out.json'));assert d['build']==12340, d;assert len(d['files'])==2, d;print('generator OK')"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: launcher/ui/package-lock.json

      - name: Install exactly what the lockfile says
        run: npm ci
        working-directory: launcher/ui

      - name: Interface typecheck and build
        run: npm run build
        working-directory: launcher/ui

      # The launcher shipped a startup that abandoned every local load when the
      # realm was unreachable, leaving the interface on a loading line with
      # blank tabs behind it. Nothing in the Rust or the typecheck could catch
      # it: the bug was in how the interface handled a rejected promise. This
      # drives the real built bundle in a real browser with the Tauri bridge
      # stubbed, once with the realm reachable and once without.
      - name: The interface survives an unreachable realm
        working-directory: launcher/ui
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          # --no-save: playwright is a harness dependency, not a launcher one,
          # and must not reach the lockfile the release build installs from.
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          npm run test:startup

      # Tauri 2 refuses every `plugin:` command that no capability grants,
      # including its own core ones, and it refuses them at runtime rather than
      # at build time. A launcher shipped with no capabilities/ directory at
      # all: `listen()` was rejected, the interface came up blank, and nothing
      # in fmt, clippy, the tests or the typecheck had anything to say about it.
      - name: Every plugin the interface uses is granted a permission
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys

          tauri_dir = pathlib.Path("launcher/src-tauri")
          caps = sorted((tauri_dir / "capabilities").glob("*.json"))
          if not caps:
              print("launcher/src-tauri/capabilities/ is empty or missing.")
              print("Without it Tauri denies plugin:event|listen, plugin:dialog|open")
              print("and every other plugin command, at runtime, on the player's machine.")
              sys.exit(1)

          granted, windows = set(), set()
          for cap in caps:
              doc = json.loads(cap.read_text())
              granted |= {str(p) for p in doc.get("permissions", [])}
              windows |= {str(w) for w in doc.get("windows", ["main"])}
          print(f"granted: {sorted(granted)}")

          bad = []

          # A capability that names a window label no window has is inert, and
          # inert in exactly the silent way this guard exists to catch.
          conf = json.loads((tauri_dir / "tauri.conf.json").read_text())
          labels = {w.get("label", "main") for w in conf["app"]["windows"]}
          for w in windows:
              if w != "*" and w not in labels:
                  bad.append(f"a capability targets window {w!r}, but the windows are {sorted(labels)}")

          # `listen` is core:event, which only core:default pulls in.
          src = " ".join(f.read_text() for f in pathlib.Path("launcher/ui/src").rglob("*.ts"))
          if "@tauri-apps/api/event" in src and not (
              {"core:default", "core:event:default", "core:event:allow-listen"} & granted
          ):
              bad.append("the interface subscribes to events but nothing grants core:event")

          # Package name to ACL prefix is Tauri's own convention: the
          # @tauri-apps/plugin-dialog package answers to `dialog:`.
          for plugin in sorted(set(re.findall(r"@tauri-apps/plugin-([a-z0-9-]+)", src))):
              if not any(p.startswith(f"{plugin}:") for p in granted):
                  bad.append(f"the interface uses @tauri-apps/plugin-{plugin}, but no {plugin}: permission is granted")

          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("the capability file covers what the interface asks for")
          PY

      - name: Fonts are vendored, not fetched
        run: |
          # The launcher's CSP admits no outside origins, so a stylesheet that
          # reaches for one renders in a fallback face and nobody notices until
          # a screenshot looks wrong.
          if grep -rn 'fonts.googleapis.com\|fonts.gstatic.com' launcher/ui/src launcher/ui/index.html; then
            echo "The interface must not fetch fonts at runtime."
            exit 1
          fi
          test -s launcher/ui/src/fonts/OFL.txt
          echo "clean"

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exactly what the lockfile says
        run: npm ci

      # Build first: it regenerates next-env.d.ts and .next/types, which the
      # typecheck below needs and which are deliberately not committed.
      - name: Build
        run: npm run build
        env:
          # No database, and none needed - every page that reads the realm is
          # rendered per request. A build that could reach one would still not
          # be allowed to bake its answers in.
          SITE_URL: https://ashmorrow.example
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: The website starts and answers
        run: |
          # Demo mode: no database, so this proves the process boots, serves
          # HTML, and reports its own health.
          DATA_SOURCE=demo \
          SESSION_SECRET=ci-only-secret-that-is-long-enough-to-pass-validation \
          SITE_URL=http://127.0.0.1:3000 \
          PORT=3000 npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"ok":true'
          for path in / /status /armory /leaderboards /play /docs /docs/classless /patch-notes /register /login; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Secrets are not committed
        run: |
          # .env.local holds database credentials and the session secret.
          if git ls-files | grep -E '^web/\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "An environment file with credentials is tracked in git."
            exit 1
          fi
          echo "clean"

  admin:
    name: Admin panel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Install exactly what the lockfile says
        run: npm ci

      # Build first: it regenerates next-env.d.ts and .next/types, which the
      # typecheck below needs and which are deliberately not committed.
      - name: Build
        run: npm run build
        env:
          ADMIN_SITE_URL: https://admin.ashmorrow.example
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # roles.ts, ip.ts, totp.ts and secretbox.ts are pure and carry the
      # security model, so they are tested exhaustively rather than reasoned
      # about. totp.test.ts asserts against RFC 6238's own published vectors.
      - name: Unit tests
        run: npm test

      - name: The panel starts and serves its sign-in page
        run: |
          # No database - port 1 answers nothing. The panel has no demo mode, so
          # this proves only what it should: the process boots and the pre-auth
          # path (config check, address resolution, allowlist) renders without
          # touching MySQL.
          #
          # DB_PASSWORD is set even though nothing connects: an empty one is a
          # startup refusal in production, which is correct behaviour and not
          # what this step is testing. The step below tests the refusals.
          ADMIN_SESSION_SECRET=ci-only-secret-that-is-long-enough-to-pass-validation \
          ADMIN_TOTP_KEY=ci-only-totp-key-that-is-long-enough-to-pass-validation \
          ADMIN_SITE_URL=http://127.0.0.1:3010 \
          DB_HOST=127.0.0.1 DB_PORT=1 DB_PASSWORD=ci-only-not-a-real-password \
          PORT=3010 npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3010/login > /dev/null && break
            sleep 1
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3010/login)
          echo "/login -> $code"
          [ "$code" = "200" ] || exit 1

          # Anonymous requests must never reach a panel page.
          for path in / /accounts /characters /trees /items /realm /audit; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3010$path")
            echo "$path -> $code"
            [ "$code" = "307" ] || [ "$code" = "302" ] || exit 1
          done

      - name: A public instance with no allowlist refuses to start
        run: |
          # This is the control that keeps the panel off the open internet, so
          # CI asserts it rather than trusting it. Starting with a warning
          # instead of failing is exactly the bug this guards against.
          set +e
          ADMIN_PUBLIC=1 \
          ADMIN_SITE_URL=https://admin.ashmorrow.example \
          ADMIN_SESSION_SECRET=ci-only-secret-that-is-long-enough-to-pass-validation \
          ADMIN_TOTP_KEY=ci-only-totp-key-that-is-long-enough-to-pass-validation \
          DB_HOST=127.0.0.1 DB_PASSWORD=x \
          PORT=3012 timeout 40 npm start > boot.log 2>&1
          status=$?
          set -e
          cat boot.log
          if [ "$status" = "0" ]; then
            echo "The panel started as public with an empty allowlist. It must refuse."
            exit 1
          fi
          grep -q "ADMIN_IP_ALLOWLIST" boot.log || {
            echo "It refused, but not for the allowlist - check the message."
            exit 1
          }
          echo "refused, as it should"

      - name: The audit table is append-only in the grants
        run: |
          # ash_admin holds INSERT on admin_audit and must never hold UPDATE or
          # DELETE. That property is what makes the log worth having, and it
          # lives in one file where a well-meaning edit could undo it.
          python3 - <<'PY'
          import re, sys, pathlib
          sql = pathlib.Path("sql/admin-grants.sql").read_text()
          grants = [
              line for line in sql.splitlines()
              if "admin_audit" in line and line.strip().upper().startswith("GRANT")
          ]
          if not grants:
              sys.exit("No GRANT on admin_audit found at all.")
          for line in grants:
              privileges = re.search(r"GRANT\s+(.*?)\s+ON", line, re.I)
              names = {p.strip().upper() for p in privileges.group(1).split(",")}
              forbidden = names & {"UPDATE", "DELETE", "ALL", "ALL PRIVILEGES", "DROP", "ALTER"}
              if forbidden:
                  sys.exit(f"admin_audit must stay append-only; found {sorted(forbidden)} in: {line}")
          print("append-only:", "; ".join(g.strip() for g in grants))
          PY

      - name: Secrets are not committed
        run: |
          # .env.local holds the database password, the session secret and the
          # TOTP key that every enrolled authenticator depends on.
          if git ls-files | grep -E '^web-admin/\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "An environment file with credentials is tracked in git."
            exit 1
          fi
          echo "clean"
