name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  sanity:
    name: Repo sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: tools/ta.py is syntactically valid
        run: python -m py_compile tools/ta.py

      - name: ta.py --help works
        run: python tools/ta.py --help

      - name: upstream.json is valid and complete
        run: |
          python - <<'PY'
          import json, re, sys
          cfg = json.load(open("upstream.json"))
          base = cfg["base"]
          for key in ("name", "url", "branch", "pinned_commit", "pinned_date"):
              assert base.get(key), f"upstream.json: base.{key} is missing"
          assert re.fullmatch(r"[0-9a-f]{40}", base["pinned_commit"]), \
              "pinned_commit must be a full 40-char SHA, not a branch or short SHA"
          assert cfg.get("modules"), "upstream.json: no modules listed"
          print(f"pinned: {base['name']} @ {base['pinned_commit'][:12]} ({base['pinned_date']})")
          PY

      - name: Pinned upstream commit actually exists
        run: |
          SHA=$(python -c "import json;print(json.load(open('upstream.json'))['base']['pinned_commit'])")
          URL=$(python -c "import json;print(json.load(open('upstream.json'))['base']['url'])")
          git init -q probe && cd probe
          git remote add origin "$URL"
          git fetch --depth 1 origin "$SHA" && echo "upstream pin $SHA is fetchable"

      - name: Every declared module exists and has a matching loader
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          cfg = json.load(open("upstream.json"))
          bad = []
          for name in cfg["modules"]:
              d = pathlib.Path("modules") / name
              if not d.is_dir():
                  bad.append(f"{name}: directory missing"); continue
              # AzerothCore derives the loader name from the directory name.
              expected = "Add" + name.replace("-", "_") + "Scripts"
              srcs = list((d / "src").rglob("*.cpp"))
              if not any(expected in s.read_text(errors="replace") for s in srcs):
                  bad.append(f"{name}: no source defines {expected}()")
              if not list((d / "conf").glob("*.conf.dist")):
                  bad.append(f"{name}: no .conf.dist")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("modules OK")
          PY

      - name: No core checkout or client data committed
        run: |
          # The overlay model depends on .acore/ never entering git history,
          # and Blizzard client data must never be redistributed.
          FOUND=$(git ls-files | grep -E '^\.acore/|\.mpq$|^data/client/|\.(dbc|map|vmtree|vmtile|mmtile)$' || true)
          if [ -n "$FOUND" ]; then
            echo "These must never be committed:"; echo "$FOUND"; exit 1
          fi
          echo "clean"

      - name: The licence is present and consistent
        run: |
          # ADR 0007. This repository spent its whole life so far asserting that
          # AzerothCore is AGPL-3.0; it is GPL-2.0-or-later, and the wrong claim
          # had reached the public FAQ. AGPL-3.0 is incompatible with
          # GPL-2.0-only, so this is a real hazard rather than a typo.
          test -f LICENSE || { echo "LICENSE is missing"; exit 1; }
          grep -q "GNU GENERAL PUBLIC LICENSE" LICENSE || { echo "LICENSE is not the GPL"; exit 1; }
          grep -q "Version 2, June 1991" LICENSE || { echo "LICENSE is not GPL-2"; exit 1; }

          STALE=$(grep -rn 'AGPL\|Affero' \
                    --include='*.md' --include='*.toml' --include='*.json' \
                    --include='*.ts' --include='*.tsx' --include='*.py' \
                    --include='*.cpp' --include='*.h' \
                    --exclude-dir=node_modules --exclude-dir=target \
                    --exclude-dir=.next --exclude-dir=.acore \
                    . | grep -v 'not AGPL-3.0' | grep -v '0007-licence.md' || true)
          if [ -n "$STALE" ]; then
            echo "Something still claims this project is AGPL. It is GPL-2.0-or-later:"
            echo "$STALE"
            echo "See docs/decisions/0007-licence.md."
            exit 1
          fi

          # Our own C++ links into a GPL binary alongside the core's, so a file
          # without a notice is genuinely ambiguous about its terms.
          BARE=$(grep -rLi 'GNU General Public License' modules --include='*.cpp' --include='*.h' || true)
          if [ -n "$BARE" ]; then
            echo "These module sources carry no licence header:"; echo "$BARE"; exit 1
          fi

          # Every manifest a package manager reads should agree with LICENSE.
          python3 - <<'PY'
          import json, pathlib, sys, re
          bad = []
          for path in ["web/package.json", "launcher/ui/package.json", "launcher/package.json"]:
              got = json.loads(pathlib.Path(path).read_text()).get("license")
              if got != "GPL-2.0-or-later":
                  bad.append(f"{path}: license is {got!r}")
          for path in ["launcher/core/Cargo.toml", "launcher/src-tauri/Cargo.toml"]:
              text = pathlib.Path(path).read_text()
              if not re.search(r'^license\s*=\s*"GPL-2\.0-or-later"', text, re.M):
                  bad.append(f"{path}: license is not GPL-2.0-or-later")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("manifests agree with LICENSE")
          PY
          echo "clean"

      - name: The launcher names no way to obtain a client
        run: |
          # ADR 0005 rules 1 and 4, enforced rather than remembered. The manifest
          # types already make a download location for a Blizzard file
          # unrepresentable; this catches an attempt to put one anywhere else,
          # and it catches a large file being committed under launcher/ at all.
          if [ ! -d launcher ]; then echo "no launcher/ yet"; exit 0; fi

          # shipped_manifest.rs is excluded because it is this same guard,
          # written in Rust against the manifest files - it has to name the
          # strings it forbids, and greping the guard for what it guards
          # against is the one false positive this check can produce.
          BAD=$(grep -rEni 'magnet:\?xt=|\.torrent\b|thepiratebay|1337x|rarbg|nyaa\.si' \
                  --exclude-dir=target --exclude-dir=node_modules --exclude-dir=dist \
                  --exclude=shipped_manifest.rs \
                  launcher/ || true)
          if [ -n "$BAD" ]; then
            echo "A locator for a client appears under launcher/:"
            echo "$BAD"
            echo "See docs/decisions/0005-client-distribution.md, rules 1 and 6."
            exit 1
          fi

          # Nothing under launcher/ should be big. Our own patch content is
          # served, never committed, and a stray archive is how a repository
          # quietly becomes a mirror.
          LARGE=$(git ls-files -s launcher | awk '{print $4}' | while read -r f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            [ "$size" -gt 1048576 ] && echo "$f ($size bytes)"
          done)
          if [ -n "$LARGE" ]; then
            echo "Files over 1 MB are committed under launcher/:"; echo "$LARGE"; exit 1
          fi
          echo "clean"

      - name: No core modifications have crept in
        run: |
          # ADR 0002: the classless system needs zero AzerothCore C++ patches.
          # If that ever stops being true, this fails loudly and the decision
          # gets revisited on purpose rather than by drift.
          if [ -d patches ] && [ -n "$(ls -A patches 2>/dev/null)" ]; then
            echo "::warning::patches/ is non-empty - we now carry core modifications."
            echo "Update docs/decisions/0002-repo-layout.md and ARCHITECTURE.md §2."
          fi
          echo "checked"

      - name: Module SQL uses directories the DB updater recognises
        run: |
          python - <<'PY'
          import json, pathlib, sys
          # UpdateFetcher.cpp matches module SQL dirs by substring against
          # "world" / "auth" / "characters". Anything else is silently ignored,
          # which is a nasty way to lose a migration.
          valid = ("db-world", "db-auth", "db-characters")
          bad = []
          for name in json.load(open("upstream.json"))["modules"]:
              sqlroot = pathlib.Path("modules") / name / "data" / "sql"
              if not sqlroot.is_dir():
                  continue
              for child in sqlroot.iterdir():
                  if child.is_dir() and child.name not in valid:
                      bad.append(f"{child}: not one of {valid}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("module SQL layout OK")
          PY

      - name: Documentation links resolve
        run: |
          python - <<'PY'
          import pathlib, re, sys
          # Skipped: the fetched core, installed dependencies, build output, and
          # web/content/, whose links are website routes rather than file paths.
          SKIP = {".acore", "node_modules", ".next", "content"}
          bad = []
          for md in pathlib.Path(".").rglob("*.md"):
              if SKIP & set(md.parts):
                  continue
              for link in re.findall(r"\]\(([^)#][^)]*)\)", md.read_text(errors="replace")):
                  if link.startswith(("http://", "https://", "mailto:", "/")):
                      continue
                  target = (md.parent / link.split("#")[0]).resolve()
                  if not target.exists():
                      bad.append(f"{md}: broken link -> {link}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all relative doc links resolve")
          PY

  launcher:
    name: Launcher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/core

      # The core carries every behaviour worth testing and has no GUI
      # dependency, so all of this runs on a plain runner with no webview.
      - name: Format
        run: cargo fmt --manifest-path launcher/core/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path launcher/core/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path launcher/core/Cargo.toml

      - name: The core builds without its network feature
        run: cargo check --manifest-path launcher/core/Cargo.toml --no-default-features

      - name: The manifest generator runs
        run: |
          cargo build --manifest-path launcher/core/Cargo.toml --bin ashmorrow-manifest
          # A synthetic client: enough structure and a real version resource, so
          # this exercises detection, walking and hashing without a game.
          python3 - <<'PY'
          import pathlib, struct
          root = pathlib.Path("/tmp/fake-client")
          (root / "Data" / "enUS").mkdir(parents=True, exist_ok=True)
          exe = bytearray(b"MZ" + b"\x11" * 30)
          exe += bytes([0xBD, 0x04, 0xEF, 0xFE])
          exe += struct.pack("<I", 0x00010000)
          exe += struct.pack("<I", (3 << 16) | 3)
          exe += struct.pack("<I", (5 << 16) | 12340)
          (root / "Wow.exe").write_bytes(bytes(exe))
          (root / "Data" / "common.MPQ").write_bytes(b"x" * 4096)
          PY
          ./launcher/core/target/debug/ashmorrow-manifest hash /tmp/fake-client | tee /tmp/out.json
          python3 -c "import json;d=json.load(open('/tmp/out.json'));assert d['build']==12340, d;assert len(d['files'])==2, d;print('generator OK')"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: launcher/ui/package-lock.json

      - name: Install exactly what the lockfile says
        run: npm ci
        working-directory: launcher/ui

      - name: Interface typecheck and build
        run: npm run build
        working-directory: launcher/ui

      # The launcher shipped a startup that abandoned every local load when the
      # realm was unreachable, leaving the interface on a loading line with
      # blank tabs behind it. Nothing in the Rust or the typecheck could catch
      # it: the bug was in how the interface handled a rejected promise. This
      # drives the real built bundle in a real browser with the Tauri bridge
      # stubbed, once with the realm reachable and once without.
      - name: The interface survives an unreachable realm
        working-directory: launcher/ui
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          # --no-save: playwright is a harness dependency, not a launcher one,
          # and must not reach the lockfile the release build installs from.
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          npm run test:startup

      - name: Fonts are vendored, not fetched
        run: |
          # The launcher's CSP admits no outside origins, so a stylesheet that
          # reaches for one renders in a fallback face and nobody notices until
          # a screenshot looks wrong.
          if grep -rn 'fonts.googleapis.com\|fonts.gstatic.com' launcher/ui/src launcher/ui/index.html; then
            echo "The interface must not fetch fonts at runtime."
            exit 1
          fi
          test -s launcher/ui/src/fonts/OFL.txt
          echo "clean"

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install exactly what the lockfile says
        run: npm ci

      # Build first: it regenerates next-env.d.ts and .next/types, which the
      # typecheck below needs and which are deliberately not committed.
      - name: Build
        run: npm run build
        env:
          # No database, and none needed - every page that reads the realm is
          # rendered per request. A build that could reach one would still not
          # be allowed to bake its answers in.
          SITE_URL: https://ashmorrow.example
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: The website starts and answers
        run: |
          # Demo mode: no database, so this proves the process boots, serves
          # HTML, and reports its own health.
          DATA_SOURCE=demo \
          SESSION_SECRET=ci-only-secret-that-is-long-enough-to-pass-validation \
          SITE_URL=http://127.0.0.1:3000 \
          PORT=3000 npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/api/health | tee /dev/stderr | grep -q '"ok":true'
          for path in / /status /armory /leaderboards /play /docs /docs/classless /patch-notes /register /login; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done

      - name: Secrets are not committed
        run: |
          # .env.local holds database credentials and the session secret.
          if git ls-files | grep -E '^web/\.env(\.|$)' | grep -v '\.env\.example'; then
            echo "An environment file with credentials is tracked in git."
            exit 1
          fi
          echo "clean"
