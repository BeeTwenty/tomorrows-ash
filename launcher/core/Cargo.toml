[package]
name = "ashmorrow-launcher-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Client verification, config injection and launch logic for the Ashmorrow launcher."
license = "AGPL-3.0-or-later"

[lib]
name = "launcher_core"
path = "src/lib.rs"

[dependencies]
blake3 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
