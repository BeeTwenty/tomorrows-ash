[package]
name = "ashmorrow-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "The Ashmorrow launcher."
license = "GPL-2.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ashmorrow-launcher-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[features]
# Tauri's own convention: the CLI passes this for a production bundle.
custom-protocol = ["tauri/custom-protocol"]
